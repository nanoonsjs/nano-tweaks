name: Build tweaks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Real macOS + Xcode, so arm64e tweaks are built with Apple's own compiler.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid make xz

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build debs
        run: |
          set +e +o pipefail
          mkdir -p out
          for p in MusicPill Control26 Photos26 InstaGlass Messages26; do  # PhotosGlass replaced by Photos26, Spotlight26 ditched
            (cd "$p" && gmake clean package FINALPACKAGE=1) > "build-$p.log" 2>&1
            rc=$?
            cat "build-$p.log"
            if [ $rc -ne 0 ]; then
              grep -E "error" "build-$p.log" | head -15 | sed 's/^/::error::/'
              tail -6 "build-$p.log" | sed 's/^/::error::/'
              exit 2
            fi
            cp "$p"/packages/*.deb out/ || { echo "::error::copy failed for $p"; exit 3; }
          done
          # Every tweak also as a rootful package (palera1n rootful, checkra1n).
          for p in MusicPill Control26 Photos26 InstaGlass Messages26; do
            rm -rf "$p/packages"
            (cd "$p" && gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=) > "build-$p-rootful.log" 2>&1
            if [ $? -ne 0 ]; then cat "build-$p-rootful.log"; grep -E "error" "build-$p-rootful.log" | head -15 | sed 's/^/::error::/'; exit 2; fi
            cp "$p"/packages/*_iphoneos-arm.deb out/ || { echo "::error::no rootful deb for $p"; ls "$p/packages"; exit 3; }
          done
          # Messages26 also for RootHide (Bootstrap on iOS 15-17, arm64e). Experimental: a failure here doesn't stop the release.
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$HOME/theos-roothide" > roothide-clone.log 2>&1 || { tail -5 roothide-clone.log | sed 's/^/::warning::/'; }
          for p in Messages26; do
            rm -rf "$p/packages"
            (cd "$p" && THEOS="$HOME/theos-roothide" gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide) > "build-$p-roothide.log" 2>&1
            if [ $? -ne 0 ]; then cat "build-$p-roothide.log"; grep -E "error" "build-$p-roothide.log" | head -10 | sed 's/^/::warning::roothide /'; continue; fi
            ls "$p/packages"
            cp "$p"/packages/*.deb out/ 2>/dev/null || echo "::warning::no roothide deb for $p"
          done
          ls -la out

      - name: Upload debs (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: out/*.deb

      - name: Publish release (direct .deb downloads for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          if ! gh release create "$tag" out/*.deb \
            --title "Build ${{ github.run_number }}" \
            --notes "Built with Xcode on GitHub Actions. Tap a .deb, then open it in Sileo or Filza." > rel.log 2>&1; then
            cat rel.log; sed 's/^/::warning::/' rel.log | head -5
            # GitHub releases failing: keep the debs on the "builds" branch instead.
            git config user.name "build bot"; git config user.email "bot@users.noreply.github.com"
            rm -rf /tmp/b && mkdir -p /tmp/b && cp out/*.deb /tmp/b/
            git checkout --orphan builds-tmp && git rm -rfq . && cp /tmp/b/*.deb . && git add *.deb
            git commit -qm "debs from build ${{ github.run_number }}" && git push -f origin builds-tmp:builds
            echo "::warning::debs pushed to the builds branch"
          fi
