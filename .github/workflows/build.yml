name: Build tweaks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Real macOS + Xcode, so arm64e tweaks are built with Apple's own compiler.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install ldid make xz

      - name: Install Theos
        run: |
          git clone --recursive --depth=1 https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Build debs
        run: |
          set +e +o pipefail
          mkdir -p out
          for p in MusicPill Control26 Photos26; do  # PhotosGlass replaced by Photos26, Spotlight26 ditched
            (cd "$p" && gmake clean package FINALPACKAGE=1) > "build-$p.log" 2>&1
            rc=$?
            cat "build-$p.log"
            if [ $rc -ne 0 ]; then
              grep -E "error" "build-$p.log" | head -15 | sed 's/^/::error::/'
              tail -6 "build-$p.log" | sed 's/^/::error::/'
              exit 2
            fi
            cp "$p"/packages/*.deb out/ || { echo "::error::copy failed for $p"; exit 3; }
          done
          # MusicPill also as a rootful package (checkra1n / palera1n rootful).
          (cd MusicPill && gmake clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=) > build-MusicPill-rootful.log 2>&1
          if [ $? -ne 0 ]; then cat build-MusicPill-rootful.log; grep -E "error" build-MusicPill-rootful.log | head -15 | sed 's/^/::error::/'; exit 2; fi
          cp MusicPill/packages/*iphoneos-arm.deb out/ 2>/dev/null || cp MusicPill/packages/*.deb out/
          ls -la out

      - name: Upload debs (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: debs
          path: out/*.deb

      - name: Publish release (direct .deb downloads for your phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${{ github.run_number }}"
          gh release create "$tag" out/*.deb \
            --title "Build ${{ github.run_number }}" \
            --notes "Built with Xcode on GitHub Actions. Tap a .deb, then open it in Sileo or Filza."
